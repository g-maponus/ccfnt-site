name: Claude Code

# @claude in an issue, issue/PR comment or PR review starts Claude Code on GitHub's runners
# (G's Claude subscription via the CLAUDE_CODE_OAUTH_TOKEN repo secret).
# Hardened 2026-11-12: only g-maponus can trigger it; actions pinned by commit SHA;
# least-privilege workflow token (writes go through the Claude GitHub App's short-lived token);
# one run at a time per issue/PR; capped turns and runtime. Rules for Claude live in CLAUDE.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only the repository owner may start Claude (the action also requires write access).
    if: |
      github.actor == 'g-maponus' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write   # lets the action obtain the Claude GitHub App token
      actions: read     # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: "--max-turns 60"
